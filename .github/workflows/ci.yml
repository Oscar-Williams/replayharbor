name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned environment and project
        run: |
          python -m pip install "delta-mfp-local-agents @ git+https://github.com/DaoyuanLi2816/delta-mfp-local-agents.git@c01fbafca01d34e5e7492d48f856d75bf6f7b8ec"
          python -m pip install . pytest==9.1.1
      - run: python scripts/check_secrets.py
      - run: python -m pytest -q
      - run: python -m replayharbor.cli verify examples/confirmed-case
      - run: python -m pip check
